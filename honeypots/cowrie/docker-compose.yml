services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: ap-cowrie
    restart: unless-stopped
    read_only: true
    security_opt:
      - seccomp:./seccomp.json
      - apparmor=apiary-cowrie
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    blkio_config:
      weight: 500
    cap_drop:
      - ALL
    networks:
      - apiary-net
    ports:
      - "2222:2222"
    volumes:
      # operator config, overrides the bundled defaults
      - ./etc/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./etc/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      # whole state dir, seeded from the image so tty and snapshots survive.
      # host keys live here and cowrie rewrites them on start
      - ./state:/cowrie/cowrie-git/var/lib/cowrie
      # logs land on the host so they survive the container
      - ./data/log:/cowrie/cowrie-git/var/log/cowrie

networks:
  apiary-net:
    external: true
