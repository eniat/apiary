services:
  dionaea:
    image: dinotools/dionaea:latest
    container_name: ap-dionaea
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /opt/dionaea/etc:rw,nosuid,size=8m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - apiary-net
    ports:
      # ftp.yaml is enabled but nothing binds 21, so no mapping for it
      - "4450:445/tcp"
    volumes:
      - ./data/log:/opt/dionaea/var/log/dionaea
      - ./data/lib:/opt/dionaea/var/lib/dionaea

networks:
  apiary-net:
    external: true
