# orchestrated honeypots under logs, the long lived ones under static
[PARSER]
    Name   instance_path
    Format regex
    Regex  ^/var/lib/apiary/(?:logs|static)/(?<instance>[^/]+)/

# event time not read time
[PARSER]
    Name        cowrie_json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On
