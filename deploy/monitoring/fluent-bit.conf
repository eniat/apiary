[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    Parsers_File /etc/apiary/parsers.conf

[INPUT]
    Name             tail
    Tag              cowrie
    Path             /var/lib/apiary/logs/*/log/cowrie.json
    Path_Key         path
    Parser           json
    DB               /var/lib/apiary/flb/tail.db
    Read_from_Head   true
    Skip_Empty_Lines On
    # honeypots appear mid run so the default sixty seconds is too slow
    Refresh_Interval 2

# instance comes off the path not the record
[FILTER]
    Name         parser
    Match        cowrie
    Key_Name     path
    Parser       instance_path
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name   record_modifier
    Match  cowrie
    Record honeypot cowrie

[OUTPUT]
    Name   stdout
    Match  *
    Format json_lines
