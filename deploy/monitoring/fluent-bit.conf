[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    Parsers_File /etc/apiary/parsers.conf
    storage.path /var/lib/apiary/flb/storage
    storage.sync normal

[INPUT]
    Name             tail
    Tag              cowrie
    Path             /var/lib/apiary/logs/*/log/cowrie.json,/var/lib/apiary/static/*/log/cowrie.json
    Path_Key         path
    Parser           cowrie_json
    DB               /var/lib/apiary/flb/tail.db
    Read_from_Head   false
    Skip_Empty_Lines On
    # honeypots appear mid run so the default sixty seconds is too slow
    Refresh_Interval 2
    # a loki restart must not cost lines
    storage.type     filesystem

[INPUT]
    Name             tail
    Tag              dionaea
    Path             /var/lib/apiary/logs/*/log/dionaea.jsonl
    Path_Key         path
    Parser           json
    DB               /var/lib/apiary/flb/tail.db
    Read_from_Head   false
    Skip_Empty_Lines On
    Refresh_Interval 2
    storage.type     filesystem

# instance comes off the path not the record
[FILTER]
    Name         parser
    Match        *
    Key_Name     path
    Parser       instance_path
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name   record_modifier
    Match  cowrie
    Record honeypot cowrie

[FILTER]
    Name   record_modifier
    Match  dionaea
    Record honeypot dionaea

[FILTER]
    Name   lua
    Match  cowrie
    script /etc/apiary/normalise.lua
    call   normalise

[FILTER]
    Name   lua
    Match  dionaea
    script /etc/apiary/normalise.lua
    call   normalise_dionaea

[FILTER]
    Name   lua
    Match  *
    script /etc/apiary/attack.lua
    call   tag_attack

# instance session and src_ip stay in the body, labels stay bounded
[OUTPUT]
    Name        loki
    Match       cowrie
    Host        loki
    Port        3100
    Labels      job=apiary, honeypot=cowrie
    line_format json
    # a loki restart leaves the ring empty for thirty seconds
    Retry_Limit False

[OUTPUT]
    Name        loki
    Match       dionaea
    Host        loki
    Port        3100
    Labels      job=apiary, honeypot=dionaea
    line_format json
    # a loki restart leaves the ring empty for thirty seconds
    Retry_Limit False
